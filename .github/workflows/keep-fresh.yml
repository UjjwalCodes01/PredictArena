# Keeps the projection fresh when the indexer daemon is not hosted anywhere.
#
# Vercel's Hobby plan caps cron frequency at once per day, which is useless for
# a league whose windows close every five minutes. GitHub's scheduler allows
# every five minutes and is free on a public repository, so it drives the same
# endpoint the daemon's loops would.
#
# MEASURED REALITY: GitHub honours this schedule badly. One run fired in an
# eight-hour window against a five-minute cadence — scheduled workflows are
# best-effort and are dropped, not queued, under load.
#
# So each invocation does as much as it usefully can rather than one cycle and
# out: it drives the endpoint repeatedly for a bounded stretch. Still an
# ordinary CI job, nowhere near a daemon, but a single lucky firing now covers
# a quarter of an hour instead of a moment.
#
# The site ALSO refreshes itself from ordinary traffic (`/api/tick`), so a
# visitor keeps the projection current whether or not GitHub ever runs this.
name: keep-fresh

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# A slow run must never stack up behind the previous one.
concurrency:
  group: keep-fresh
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Drive one ingest cycle
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET is unset — add them as repository secrets."
            echo "Skipping rather than failing, so the schedule does not spam failures."
            exit 0
          fi

          # A trailing slash in APP_URL would build ".../api" with a double
          # slash and 404. Easy to paste, invisible in the secrets UI, and it
          # would look exactly like the endpoint being broken.
          BASE="${APP_URL%/}"
          # Tolerate the scheme being omitted, for the same reason.
          case "$BASE" in http://*|https://*) ;; *) BASE="https://$BASE" ;; esac
          echo "Target: $BASE/api/cron/ingest"

          # One transient failure must not paint the run red. The ingest cycle
          # does real work against a venue indexer we have MEASURED hanging at
          # random (a bare Market query timing out at 31s), and a red schedule
          # that cries wolf gets ignored — which is worse than no schedule.
          # So the transient class (503, unreachable, 5xx) gets three attempts;
          # the deterministic class (bad secret, wrong URL) stays immediately
          # fatal, because retrying cannot fix configuration.
          #
          # -w writes the status on its own line so a failure names itself
          # rather than leaving an empty log to guess at.
          STATUS="000"
          for ATTEMPT in 1 2 3; do
            STATUS=$(curl --silent --show-error --max-time 120 \
                          --header "Authorization: Bearer $CRON_SECRET" \
                          --output response.json \
                          --write-out '%{http_code}' \
                          "$BASE/api/cron/ingest") || STATUS="000"

            echo "attempt $ATTEMPT: HTTP $STATUS"
            cat response.json 2>/dev/null || true
            echo

            case "$STATUS" in
              200) break ;;
              401) echo "::error::CRON_SECRET does not match the one set in the deployment."; exit 1 ;;
              404) echo "::error::Endpoint not found. Check APP_URL, and that the deployment includes /api/cron/ingest."; exit 1 ;;
              *)   if [ "$ATTEMPT" -lt 3 ]; then
                     echo "Transient (HTTP $STATUS) — the venue or database may be having a moment. Retrying in 30s."
                     sleep 30
                   fi ;;
            esac
          done

          case "$STATUS" in
            200) ;;
            503) echo "::error::Three cycles in a row reported failure — see the bodies above. CRON_SECRET may be unset in the deployment, or the venue is down hard."; exit 1 ;;
            000) echo "::error::Could not reach $BASE at all, three times."; exit 1 ;;
            *)   echo "::error::Unexpected HTTP $STATUS after three attempts."; exit 1 ;;
          esac

          if ! grep -q '"ok":true' response.json; then
            echo "::error::Ingest cycle returned 200 but reported ok:false."
            exit 1
          fi
          echo "First cycle completed."

          # GitHub fires this rarely, so make a firing count. Roughly fifteen
          # more minutes of cycles, then exit cleanly well inside the job
          # timeout. A failure here is NOT fatal: the first cycle already
          # succeeded, and the next scheduled run (or a page view) picks up.
          DEADLINE=$(( $(date +%s) + 15 * 60 ))
          CYCLES=1
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            sleep 45
            CODE=$(curl --silent --show-error --max-time 90 \
                        --header "Authorization: Bearer $CRON_SECRET" \
                        --output /dev/null --write-out '%{http_code}' \
                        "$BASE/api/cron/ingest") || CODE="000"
            CYCLES=$((CYCLES + 1))
            echo "  cycle $CYCLES -> HTTP $CODE"
          done
          echo "Ran $CYCLES cycles."

      - name: Report health
        if: always()
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          [ -z "$APP_URL" ] && exit 0
          # Informational: shows in the run log whether anything else is degraded.
          curl --silent --max-time 60 "$APP_URL/api/health" || true
