name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    # Everything here is offline and pure: no testnet, no keys, no RPC. That is
    # what keeps CI fast and green regardless of testnet weather.
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      # No `version` here on purpose: it comes from `packageManager` in
      # package.json, so CI and local development cannot drift apart. The old
      # pin said 10 while the repo was developed on 11.
      - uses: pnpm/action-setup@v6

      # No `cache: pnpm` here, deliberately.
      #
      # setup-node keys the pnpm store cache on the LOCKFILE hash. When this
      # workflow moved from pnpm 10 to 11 the lockfile did not change, so every
      # run kept restoring a store laid out by the previous major and the
      # install failed on a tree that installs cleanly everywhere else. A cache
      # that survives the thing it should be keyed on is worse than no cache:
      # install is a few seconds either way, well inside the 2-minute budget.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Printed before anything can fail, so a red run says WHICH toolchain
      # produced it instead of leaving us to guess from a bare exit code.
      - name: Toolchain
        run: |
          echo "node    $(node --version)"
          echo "pnpm    $(pnpm --version)"
          echo "corepack $(corepack --version 2>/dev/null || echo 'n/a')"
          echo "packageManager: $(node -p "require('./package.json').packageManager ?? 'unset'")"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (eslint + no-float-money + no-mainnet)
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Assert no secrets committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked. Remove it and rotate every key in it."
            exit 1
          fi
          if git grep -nE '(PRIVATE_KEY|SECRET)[[:space:]]*=[[:space:]]*0x[0-9a-fA-F]{64}' -- . ':!*.example' >/dev/null 2>&1; then
            echo "::error::A private key appears in a tracked file."
            git grep -nE '(PRIVATE_KEY|SECRET)[[:space:]]*=[[:space:]]*0x[0-9a-fA-F]{64}' -- . ':!*.example'
            exit 1
          fi
          echo "No secrets in tracked files."
