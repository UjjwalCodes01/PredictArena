name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    # Everything here is offline and pure: no testnet, no keys, no RPC. That is
    # what keeps CI fast and green regardless of testnet weather.
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      # No `version` here on purpose: it comes from `packageManager` in
      # package.json, so CI and local development cannot drift apart. The old
      # pin said 10 while the repo was developed on 11.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (eslint + no-float-money + no-mainnet)
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Assert no secrets committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked. Remove it and rotate every key in it."
            exit 1
          fi
          if git grep -nE '(PRIVATE_KEY|SECRET)[[:space:]]*=[[:space:]]*0x[0-9a-fA-F]{64}' -- . ':!*.example' >/dev/null 2>&1; then
            echo "::error::A private key appears in a tracked file."
            git grep -nE '(PRIVATE_KEY|SECRET)[[:space:]]*=[[:space:]]*0x[0-9a-fA-F]{64}' -- . ':!*.example'
            exit 1
          fi
          echo "No secrets in tracked files."
